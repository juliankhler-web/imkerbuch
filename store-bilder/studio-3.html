<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ImkerBuch – Store-Bild iPhone 7</title>
<!-- Bühne für die App-Store-Bilder: EIN durchgehendes Panorama (3 × 1320 px breit),
     das tools/store-bilder.mjs in Einzelbilder 1320×2868 schneidet.
     ?app=dunkel → App-Bildschirme im dunklen Design. -->
<link rel="stylesheet" href="studio.css">
<style>html, body, .buehne { width: 1320px !important; }</style>
</head>
<body>
<div class="buehne" id="buehne">
  <svg class="waben" width="3960" height="2868" aria-hidden="true">
    <defs><pattern id="hex" width="120" height="208" patternUnits="userSpaceOnUse" patternTransform="scale(1.6)">
      <path d="M60 0 L120 34.6 L120 104 L60 138.6 L0 104 L0 34.6 Z M60 138.6 L60 208 M0 104 L-60 138.6 M120 104 L180 138.6" fill="none" stroke="rgba(233,162,28,.10)" stroke-width="2.2"/>
    </pattern></defs>
    <rect width="3960" height="2868" fill="url(#hex)"/>
  </svg>
  <svg class="band" width="3960" height="2868" aria-hidden="true">
    <defs>
      <linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#FFD27A" stop-opacity="0"/><stop offset=".15" stop-color="#FFD27A" stop-opacity=".9"/><stop offset=".5" stop-color="#E9A21C"/><stop offset=".85" stop-color="#FFD27A" stop-opacity=".9"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></linearGradient>
      <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    </defs>
    <path id="welle" d="M-100 1950 C 600 1500, 1000 2300, 1700 2150 S 2600 1750, 3100 2250 S 3800 2600, 4100 2350" fill="none"/>
    <use href="#welle" stroke="#E9A21C" stroke-width="70" stroke-opacity=".35" filter="url(#glow)"/>
    <use href="#welle" stroke="url(#bg1)" stroke-width="10"/>
    <path d="M-100 2080 C 620 1640, 1050 2420, 1720 2290 S 2620 1890, 3120 2390 S 3820 2720, 4100 2490" fill="none" stroke="url(#bg1)" stroke-width="3" stroke-opacity=".55"/>
  </svg>

  <!-- 7 · Deine App, dein Betrieb (Julian: Anpassen hervorheben) -->
  <section class="feld">
    <div class="titel"><h1>Deine App.<br><em>Dein Betrieb.</em></h1><p>Startseite und Schnellzugriffe<br>stellst du selbst zusammen.</p></div>
    <div class="phone" style="left:360px; top:1180px; transform: rotate(3deg);"><div class="screen">
      <div class="status"><span></span><div class="insel"></div><span class="rechts">%STATUS%</span></div>
      <img src="roh/dash-anpassen%SUFFIX%.png" alt="">
    </div></div>
    <div class="glas" style="left:70px; top:1260px;"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M17.5 14v7M14 17.5h7"/></svg></span><span>Kacheln an und aus<small>nur, was du brauchst</small></span></div>
    <div class="glas" style="left:70px; top:1680px;"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></span><span>Reihenfolge ziehen<small>wie es zu dir passt</small></span></div>
    <div class="glas" style="left:70px; top:2100px;"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9z"/></svg></span><span>Eigene Schnellzugriffe<small>in der Leiste unten</small></span></div>
  </section>
</div>
<script src="studio.js"></script>
</body>
</html>
