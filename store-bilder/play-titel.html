<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ImkerBuch – Google-Play-Titelgrafik</title>
<!-- Titelgrafik („Feature graphic“) für Google Play: 1024 × 500. Gerendert in doppelter
     Größe (2048 × 1000) und danach verkleinert – tools/store-bilder.mjs --play-titel. -->
<style>
  :root { --honig: #E9A21C; --creme: #FFF6E6; --nacht: #0F0C09; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2048px; height: 1000px; overflow: hidden; background: var(--nacht); }
  body { font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
  .buehne { position: relative; width: 2048px; height: 1000px; overflow: hidden;
    background:
      radial-gradient(900px 700px at 1500px 700px, rgba(233,162,28,.34), transparent 70%),
      radial-gradient(800px 600px at 200px 900px, rgba(233,162,28,.22), transparent 70%),
      linear-gradient(180deg, #17120D 0%, #0F0C09 60%, #120D08 100%); }
  .waben { position: absolute; inset: 0; opacity: .5; -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%, #000 100%); }
  .band { position: absolute; inset: 0; }
  .text { position: absolute; left: 120px; top: 120px; width: 1000px; }
  .marke { display: flex; align-items: center; gap: 22px; font-size: 52px; font-weight: 700; color: var(--creme); letter-spacing: -.5px; }
  .marke svg { width: 76px; height: 76px; }
  h1 { margin-top: 48px; font-size: 116px; line-height: 1.0; font-weight: 800; letter-spacing: -4px; color: var(--creme); }
  h1 em { font-style: normal; background: linear-gradient(100deg, #FFE3A3 0%, #E9A21C 55%, #C77D0A 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 40px; font-size: 44px; color: rgba(255,246,230,.7); font-weight: 500; letter-spacing: -.3px; }
  /* Android-Handy, angeschnitten */
  .phone { position: absolute; left: 1290px; top: 150px; width: 560px; height: 1216px; border-radius: 72px; padding: 13px; transform: rotate(6deg);
    background: linear-gradient(145deg, #2E2B28 0%, #151312 40%, #0A0908 75%, #26231F 100%);
    box-shadow: 0 0 0 2px #3A3530 inset, 0 80px 140px rgba(0,0,0,.65), 0 0 140px rgba(233,162,28,.2); }
  .screen { position: relative; width: 100%; height: 100%; border-radius: 60px; overflow: hidden; background: #161619; }
  .screen img { display: block; width: 100%; }
  .loch { position: absolute; top: 26px; left: 50%; transform: translateX(-50%); width: 34px; height: 34px; border-radius: 50%; background: #050505; z-index: 2; }
  .leiste { height: 88px; }
  .biene { position: absolute; left: 1060px; top: 120px; width: 300px; transform: rotate(-8deg); filter: drop-shadow(0 30px 50px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div class="buehne">
  <svg class="waben" width="2048" height="1000" aria-hidden="true">
    <defs><pattern id="hex" width="120" height="208" patternUnits="userSpaceOnUse" patternTransform="scale(1.3)">
      <path d="M60 0 L120 34.6 L120 104 L60 138.6 L0 104 L0 34.6 Z M60 138.6 L60 208 M0 104 L-60 138.6 M120 104 L180 138.6" fill="none" stroke="rgba(233,162,28,.10)" stroke-width="2.2"/>
    </pattern></defs>
    <rect width="2048" height="1000" fill="url(#hex)"/>
  </svg>
  <svg class="band" width="2048" height="1000" aria-hidden="true">
    <defs>
      <linearGradient id="bg1" x1="0" x2="1"><stop offset="0" stop-color="#FFD27A" stop-opacity="0"/><stop offset=".2" stop-color="#FFD27A" stop-opacity=".9"/><stop offset=".55" stop-color="#E9A21C"/><stop offset=".9" stop-color="#FFD27A" stop-opacity=".9"/><stop offset="1" stop-color="#FFD27A" stop-opacity="0"/></linearGradient>
      <filter id="glow" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    </defs>
    <path id="welle" d="M-100 900 C 400 760, 800 1000, 1250 820 S 1900 620, 2200 760" fill="none"/>
    <use href="#welle" stroke="#E9A21C" stroke-width="60" stroke-opacity=".32" filter="url(#glow)"/>
    <use href="#welle" stroke="url(#bg1)" stroke-width="8"/>
  </svg>
  <div class="text">
    <div class="marke"><svg viewBox="0 0 64 64"><path d="M20 6l12 7v14l-12 7-12-7V13z M44 6l12 7v14l-12 7-12-7V13z M32 30l12 7v14l-12 7-12-7V37z" fill="#E9A21C"/></svg>ImkerBuch</div>
    <h1>Dein Stockbuch.<br><em>Offline.<br>Ohne Abo.</em></h1>
    <p>Vom ersten Volk bis zum Imkereibetrieb.</p>
  </div>
  <div class="phone"><div class="screen"><div class="loch"></div><div class="leiste"></div><img src="roh/dashboard-dunkel.png" alt=""></div></div>
  <img class="biene" src="imme-gross.png" alt="">
</div>
</body>
</html>
